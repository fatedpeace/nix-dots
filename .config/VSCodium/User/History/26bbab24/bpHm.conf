
# ============================================================
# MINIMAL HYPRLOCK
# ============================================================
# Clean, dark, and minimal to match the rest of the rice.
# ============================================================


# ============================================================
# BACKGROUND
# ============================================================

background {
    monitor =

    # Uses the current desktop as the lock-screen background.
    # This keeps the currently visible awww wallpaper.
    path = ~/dotfiles/wallpaper/3.png

    # Slight dark overlay behind the blur.
    color = rgba(25, 20, 20, 1.0)

    # ========================================================
    # BLUR
    # ========================================================

    blur_passes = 3
    blur_size = 8

    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172

    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}


# ============================================================
# PASSWORD FIELD
# ============================================================

input-field {
    monitor =

    # --------------------------------------------------------
    # SIZE
    # --------------------------------------------------------

    size = 250, 50

    position = 0, 0
    halign = center
    valign = center


    # --------------------------------------------------------
    # SHAPE
    # --------------------------------------------------------

    # Clean pill-shaped password field.
    rounding = -1

    outline_thickness = 2


    # --------------------------------------------------------
    # PASSWORD DOTS
    # --------------------------------------------------------

    dots_size = 0.25
    dots_spacing = 0.35

    dots_center = true

    # Make dots respect the rounded field.
    dots_rounding = -2


    # --------------------------------------------------------
    # COLORS
    # --------------------------------------------------------

    # Very subtle border.
    outer_color = rgba(255, 255, 255, 0.12)

    # Slightly transparent dark background.
    inner_color = rgba(10, 10, 10, 0.40)

    # Password dot/text colour.
    font_color = rgb(245, 245, 245)


    # --------------------------------------------------------
    # EMPTY STATE
    # --------------------------------------------------------

    # Password field fades away when unused.
    fade_on_empty = true

    # Time before fading.
    fade_timeout = 1000

    # No placeholder text.
    placeholder_text =

    hide_input = false


    # --------------------------------------------------------
    # AUTHENTICATION STATES
    # --------------------------------------------------------

    # While checking password.
    check_color = rgba(255, 255, 255, 0.60)

    # Wrong password.
    fail_color = rgb(204, 34, 34)

    # Minimal failure message.
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    fail_timeout = 2000
}
